@if (isLoggedIn$ | async; as usuario) {
  <header class="site-header">
    <div class="nav-shell">
      <a routerLink="/" class="brand" aria-label="Mi Empresa, inicio">
        <span class="brand-symbol" aria-hidden="true">M<span>.</span></span>
        <span>Mi Empresa<small>GESTIÓN EMPRESARIAL</small></span>
      </a>
      <nav aria-label="Navegación principal">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Inicio</a>
        <a routerLink="/sucursales" routerLinkActive="active" ariaCurrentWhenActive="page">Sucursales</a>
        <a routerLink="/clientes" routerLinkActive="active" ariaCurrentWhenActive="page">Clientes</a>
        <a routerLink="/ventas" routerLinkActive="active" ariaCurrentWhenActive="page">Ventas</a>
      </nav>
      <div class="account">
        <span class="avatar" aria-hidden="true">{{ usuario }}</span>
        <span class="account-label">{{ auth.categoria(usuario) }}<small>Sesión activa</small></span>
        <button class="secondary exit" type="button" (click)="auth.logout()" aria-label="Cerrar sesión">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 4H4v16h5M14 8l4 4-4 4M8 12h10"/></svg>
          <span>Salir</span>
        </button>
      </div>
    </div>
  </header>
  @if (auth.errorLogout | async; as error) { <p class="notice error" role="alert">{{ error }}</p> }
}
